<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Amiri;src:url(assets/fonts/Amiri-Bold.ttf);font-weight:700}
@font-face{font-family:Amiri;src:url(assets/fonts/Amiri-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(assets/fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
@font-face{font-family:Plex;src:url(assets/fonts/IBMPlexSansArabic-Regular.ttf);font-weight:400}
body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<img id="stone" src="assets/cut/stone.png" style="display:none">
<img id="palace" src="assets/cut/palace.png" style="display:none">
<img id="pb0" src="assets/cut/palace_b0.png" style="display:none">
<img id="pb1" src="assets/cut/palace_b1.png" style="display:none">
<img id="pb2" src="assets/cut/palace_b2.png" style="display:none">
<img id="wp0" src="assets/cut/wall_p0.png" style="display:none">
<img id="wp1" src="assets/cut/wall_p1.png" style="display:none">
<img id="wp2" src="assets/cut/wall_p2.png" style="display:none">
<img id="gp0" src="assets/cut/granada_p0.png" style="display:none">
<img id="gp1" src="assets/cut/granada_p1.png" style="display:none">
<img id="gp2" src="assets/cut/granada_p2.png" style="display:none">
<img id="manu" src="assets/cut/manuscript.png" style="display:none">
<img id="map" src="assets/gen_raw/map_plate.png" style="display:none">
<img id="pano" src="assets/alhambra_panorama.jpg" style="display:none">
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function spring(t,k=170,d=26){if(t<=0)return 0;const w0=Math.sqrt(k),z=d/(2*w0);if(z<1){const wd=w0*Math.sqrt(1-z*z);return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t));}return 1-Math.exp(-w0*t)*(1+w0*t);}
const SNAPPY=[320,30],DEFAULT=[170,26],HEAVY=[90,20],PLAYFUL=[220,14];
function track(t,keys,k=170,d=26){let v=keys[0][1];for(let i=1;i<keys.length;i++)v+=(keys[i][1]-keys[i-1][1])*spring(t-keys[i][0],k,d);return v;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const grain=document.createElement('canvas');grain.width=W;grain.height=H;{const g=grain.getContext('2d'),r=rng(7);const id=g.createImageData(W,H);for(let i=0;i<id.data.length;i+=4){const v=200+Math.floor(r()*55);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.floor(r()*16);}g.putImageData(id,0,0);}
const $=id=>document.getElementById(id);
function board(){ctx.fillStyle='#16171c';ctx.fillRect(0,0,W,H);ctx.drawImage(grain,0,0);const g=ctx.createRadialGradient(W/2,40,80,W/2,320,950);g.addColorStop(0,'rgba(255,214,150,.12)');g.addColorStop(1,'rgba(0,0,0,.30)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
// image layer: springs control dy/dx/scale/rot/alpha. shadow = physical paper separation
function layer(img,cx,cy,w,o={}){const s=o.scale??1;if(s<=0.01)return;const h=w*img.naturalHeight/img.naturalWidth;ctx.save();ctx.globalAlpha=o.alpha??1;ctx.translate(cx+(o.dx||0),cy+(o.dy||0));ctx.rotate(o.rot||0);ctx.scale(s,s);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=o.sh??20;ctx.shadowOffsetY=10;ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();}
function tornPath(x,y,w,h,seed,jit=6){const r=rng(seed);ctx.beginPath();const n=7;for(let i=0;i<=n;i++){const px=x+(w/n)*i,py=y+(i===0||i===n?0:(r()-.5)*jit);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}for(let i=1;i<=n;i++){ctx.lineTo(x+w,y+(h/n)*i+(i===n?0:(r()-.5)*jit));}for(let i=n-1;i>=0;i--)ctx.lineTo(x+(w/n)*i,y+h+(i===0||i===n?0:(r()-.5)*jit));for(let i=n-1;i>=1;i--)ctx.lineTo(x,y+(h/n)*i+(r()-.5)*jit);ctx.closePath();}
function paper(x,y,w,h,fill,seed,o={}){const s=o.scale??1;if(s<=.01||(o.alpha??1)<=0)return;ctx.save();ctx.globalAlpha=o.alpha??1;ctx.translate(x+w/2,y+h/2);ctx.rotate(o.rot||0);ctx.scale(s,s);ctx.translate(-w/2,-h/2);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=16;ctx.shadowOffsetY=7;tornPath(0,0,w,h,seed);ctx.fillStyle=fill;ctx.fill();ctx.restore();}
function tape(x,y,w,rot=0,a=.85){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;ctx.fillStyle='#d8c9a3';ctx.fillRect(-w/2,-13,w,26);ctx.globalAlpha=a*.5;ctx.fillStyle='#efe6cc';ctx.fillRect(-w/2,-13,w,5);ctx.restore();}
function pin(x,y){ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;ctx.fillStyle='#1b1b1f';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#44444e';ctx.beginPath();ctx.arc(x-2,y-2,3.5,0,7);ctx.fill();ctx.restore();}
function txt(str,x,y,size,font,fill,align='right',alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.direction='rtl';ctx.textAlign=align;ctx.font=`700 ${size}px ${font==='A'?'Amiri':'Plex'}`;ctx.fillStyle=fill;ctx.fillText(str,x,y);ctx.restore();}
function label(str,x,y,size=30){ctx.save();ctx.direction='rtl';ctx.font=`700 ${size}px Plex`;const w=ctx.measureText(str).width+44;ctx.fillStyle='#101014';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fillRect(x-w,y-size-14,w,size+26);ctx.shadowColor='transparent';ctx.fillStyle='#f2ead8';ctx.textAlign='right';ctx.fillText(str,x-22,y+2);ctx.restore();}
// red wax/stamp seal with real text inside
function seal(cx,cy,r,str,t,t0){const s=spring(t-t0,...HEAVY);if(s<=.02)return;ctx.save();ctx.translate(cx,cy);ctx.scale(Math.max(.01,s),Math.max(.01,s));ctx.rotate(-.12);ctx.globalAlpha=clamp(s*1.6);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;ctx.fillStyle='#a02318';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#e8c9a0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r-9,0,7);ctx.stroke();ctx.direction='rtl';ctx.textAlign='center';ctx.font=`700 ${r*.52}px Amiri`;ctx.fillStyle='#f3e2c2';ctx.fillText(str,0,r*.18);ctx.restore();}
let T=0;
function headline(words,xRight,y,size,t0,stagger,preset,colors){ctx.save();ctx.direction='rtl';ctx.font=`700 ${size}px Amiri`;let x=xRight;words.forEach((wd,i)=>{const w=ctx.measureText(wd+' ').width;const s=spring(T-t0-i*stagger,...preset);if(s>0.02){ctx.save();ctx.translate(x-w/2,y);ctx.scale(Math.max(.01,s),Math.max(.01,s));ctx.globalAlpha=clamp(s*1.4);ctx.textAlign='center';ctx.fillStyle=colors[i]||'#f2ead8';ctx.fillText(wd,0,0);ctx.restore();}x-=w;});ctx.restore();}
const outA=(t,tOut)=>clamp((tOut+.35-t)/.35);
// palace assembled from 3 cut bands; each band springs from a different direction
function palaceAssemble(cx,cyTop,totalW,t,t0){const bands=[$('pb0'),$('pb1'),$('pb2')],tops=[0,.33,.59];
 bands.forEach((im,i)=>{const bh=totalW*im.naturalHeight/im.naturalWidth,th=totalW*437/1233;const s=spring(t-t0-i*.38,...DEFAULT);if(s<=.02)return;const fromY=i===0?-190:(i===2?210:0),fromX=i===1?-260:0;
  layer(im,cx+fromX*(1-s),cyTop+tops[i]*th+bh/2+fromY*(1-s),totalW,{alpha:clamp(s*1.5)});});}
// ---------- S1 stone / poetry ----------
function S1(t){board();ctx.save();ctx.globalAlpha=outA(t,4.05);
 // small map scrap pinned left (archive evidence)
 const sc=spring(t-.55,...DEFAULT);ctx.save();ctx.translate(255,300);ctx.rotate(-.04);ctx.scale(Math.max(.01,sc),Math.max(.01,sc));ctx.globalAlpha=clamp(sc*1.4);ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;ctx.drawImage($('map'),-190,-150,380,300);ctx.restore();if(sc>.5){pin(255,165);tape(140,175,95,.5,clamp(sc));}
 // stone cutout drops HEAVY, lands ~1.0
 const drop=spring(t-.45,...HEAVY);layer($('stone'),760,415+(1-drop)*-620,790,{alpha:1,rot:(1-drop)*-.06});
 // ink line writes itself across the parchment part of the stone (pen interaction)
 const wp=clamp((t-1.55)/1.15);if(wp>0&&wp<1.05){ctx.save();ctx.strokeStyle='rgba(43,32,22,.85)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();const x0=1075,x1=1075-330*wp;ctx.moveTo(1075,330);ctx.bezierCurveTo(990,312,905,352,x1,330+18*Math.sin(wp*9));ctx.stroke();ctx.fillStyle='#241a12';ctx.beginPath();ctx.arc(x1,330+18*Math.sin(wp*9),6,0,7);ctx.fill();ctx.restore();}
 // red thread from stone pin to the word الشعر
 const rp=clamp((t-2.75)/.8);if(rp>0){ctx.save();ctx.strokeStyle='#d43a2a';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(1010,520);ctx.bezierCurveTo(900,585,760,600,640,605);ctx.setLineDash([1400]);ctx.lineDashOffset=1400*(1-rp);ctx.stroke();ctx.restore();pin(1010,520);}
 headline(['هل','يمكن','لحجرٍ'],1180,148,84,.9,.22,PLAYFUL,[]);
 headline(['أن','يحفظ','الشعر؟'],1180,668,96,1.7,.22,PLAYFUL,['#f2ead8','#f2ead8','#d43a2a']);
 txt('حجرٌ واحد… وقصيدةٌ عمرها ثمانية قرون',1180,705,30,'P','#e0d3ae','right',clamp((t-3.0)/.4));
 ctx.restore();}
// ---------- S2 wall / 800 years ----------
function S2(t){board();ctx.save();ctx.globalAlpha=outA(t,10.85);const lt=t-4.39;
 headline(['وهل','يمكن','لجدرانٍ'],1180,138,68,.2,.2,PLAYFUL,[]);
 headline(['أن','تروي','تاريخًا؟'],1180,222,68,.9,.2,PLAYFUL,['#f2ead8','#f2ead8','#d43a2a']);
 // three wall panels slide up and lock together (paper taps)
 const pw=940,ph=pw*605/1248,px=640,py=548;
 [2,1,0].forEach(k=>{const im=$('wp'+k);const s=spring(lt-1.35-k*.32,...SNAPPY);if(s<=.02)return;const segW=pw/3;layer(im,px-pw/2+segW*(k+.5),py+(1-s)*330,segW+6,{alpha:clamp(s*1.5)});});
 if(lt>2.2){tape(205,452,110,-.5);tape(1075,452,110,.5);pin(640,438);}
 // timeline + rolling counter
 const tp=clamp((lt-2.9)/1.5);ctx.save();ctx.strokeStyle='#d8c9a3';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(1150,318);ctx.lineTo(1150-950*tp,318);ctx.stroke();for(let i=0;i<=8;i++){const s=spring(lt-2.9-i*.16,...SNAPPY);if(s<=0)continue;const x=1150-i*118;ctx.fillStyle=i===8?'#d43a2a':'#d8c9a3';ctx.beginPath();ctx.arc(x,318,7*s,0,7);ctx.fill();}ctx.restore();
 const num=Math.round(track(lt,[[2.95,0],[4.75,800]],90,20));if(lt>2.85){txt(String(num),690,425,105,'A','#d43a2a','right',1);txt('عامًا من التاريخ',1075,418,44,'A','#f2ead8','right',1);}
 seal(1085,545,70,'٨٠٠',t,8.9);
 ctx.restore();}
// ---------- S3 map / hill / palace / manuscript ----------
function S3(t){board();const lt=t-11.19;ctx.save();ctx.globalAlpha=outA(t,25.75);
 // map plate takes the whole board
 const ms=spring(lt-.1,...DEFAULT);ctx.save();ctx.globalAlpha=clamp(ms*1.3);ctx.translate(640,360);ctx.scale(.94+.06*ms,.94+.06*ms);ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=24;ctx.drawImage($('map'),-610,-342,1220,684);ctx.restore();
 if(lt>.4){pin(190,120);pin(1090,110);}
 // Granada houses assemble cluster bottom-left on the map (3 cut clusters pop in)
 [0,1,2].forEach(k=>{const im=$('gp'+k);const s=spring(lt-1.5-k*.3,...PLAYFUL);if(s<=.02)return;const gw=470;layer(im,235+k*148,548,gw/3+8,{scale:Math.max(.01,s),alpha:clamp(s*1.5)});});
 if(lt>2.3)label('غرناطة',470,650,28);
 // palace bands assemble on the hill (center of map)
 palaceAssemble(760,150,760,lt,2.9);
 if(lt>4.0){label('هضبة السبيكة',1150,165,29);pin(760,175);}
 // red route string: Granada -> palace (draws itself)
 const rp=clamp((lt-4.9)/1.2);if(rp>0){ctx.save();ctx.strokeStyle='#c1272d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(455,610);ctx.bezierCurveTo(560,520,610,430,700,300);ctx.bezierCurveTo(730,255,745,225,758,200);ctx.setLineDash([1600]);ctx.lineDashOffset=1600*(1-rp);ctx.stroke();ctx.restore();}
 if(lt>6.2)label('قصرٌ لم يُبنَ ليكونَ مجردَ قصر',1150,650,28);
 // manuscript sweeps in; real parchment strip + real calligraphy over it
 const mp=spring(lt-11.35,...DEFAULT);if(mp>.02){layer($('manu'),640,385,700,{scale:Math.max(.01,mp),alpha:clamp(mp*1.5),rot:-.01});
  if(lt>12.1){paper(320,330,640,120,'#ece1c8',91,{alpha:clamp((lt-12.1)*3),rot:-.008});
   const rp2=clamp((lt-12.35)/1.5);ctx.save();ctx.beginPath();ctx.rect(935-610*rp2,330,610*rp2,120);ctx.clip();txt('بَلْ كُتِبَ ليكونَ قصيدة',935,408,50,'A','#7d2418','right',1);ctx.restore();}}
 ctx.restore();}
// ---------- S4 title / real photo / hero palace ----------
function S4(t){board();const lt=t-26.12;ctx.save();ctx.globalAlpha=clamp((6.15-lt)/.5);
 // hero palace strip along the bottom (the assembled collage, living)
 const hs=spring(lt-.2,...DEFAULT);ctx.save();ctx.beginPath();ctx.rect(0,618,1280,102);ctx.clip();ctx.globalAlpha=clamp(hs*1.4)*.9;layer($('palace'),640,600,1180,{scale:Math.max(.01,hs)});ctx.restore();
 paper(55,65,575,470,'#a02318',71,{alpha:clamp(spring(lt-.05,...PLAYFUL)*1.5),rot:.02});
 // real photo print
 const ps=spring(lt-.35,...DEFAULT);ctx.save();ctx.translate(335,295);ctx.rotate(-.035);ctx.scale(Math.max(.01,ps),Math.max(.01,ps));ctx.globalAlpha=clamp(ps*1.5);ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=22;ctx.shadowOffsetY=10;ctx.fillStyle='#efe8d8';ctx.fillRect(-275,-190,550,380);ctx.shadowColor='transparent';const img=$('pano');ctx.save();ctx.beginPath();ctx.rect(-260,-175,520,305);ctx.clip();ctx.filter='grayscale(.5) contrast(1.12) sepia(.3)';ctx.drawImage(img,-260,-175,520,305);ctx.restore();ctx.filter='none';txt('الحمراء فوق هضبة السبيكة',255,168,24,'P','#3a3226','right',1);ctx.restore();tape(130,118,120,-.6);tape(540,122,120,.5);pin(335,112);
 // title
 const ts=spring(lt-1.15,...HEAVY);ctx.save();ctx.translate(950,285);ctx.scale(Math.max(.01,ts),Math.max(.01,ts));ctx.globalAlpha=clamp(ts*1.6);ctx.direction='rtl';ctx.textAlign='center';ctx.font='700 106px Amiri';ctx.fillStyle='#e8ddc4';ctx.fillText('قصر الحمراء',0,0);ctx.font='400 38px Amiri';ctx.fillStyle='#c9a227';ctx.fillText('ولا غالبَ إلا الله',0,62);ctx.restore();
 seal(1150,455,66,'الحمراء',t,t-.0+0); // placeholder replaced below
 if(lt>2.9)label('آخر شاهدٍ حيّ على مجد الأندلس',1175,478,33);
 if(lt>4.6)txt('قصيدةٌ من حجر — لا تموت',1175,552,28,'P','#e0d3ae','right',clamp((lt-4.6)/.5));
 ctx.restore();}
window.seek=(t)=>{T=t;ctx.clearRect(0,0,W,H);
 // fix seal timing by scene-local clocks
 if(t<4.39)S1(t);else if(t<11.19)S2(t);else if(t<26.12)S3(t);else S4(t);};
</script></body></html>
